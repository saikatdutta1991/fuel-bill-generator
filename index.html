<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="assets/css/common.css" />
  </head>
  <body class="bg-light">
    <div class="container">
      <div class="text-center">
        <h2>Fuel Bill Generator</h2>
        <p class="lead">Let's Generate. Fill in Your Information</p>
      </div>
      <div class="row">
        <div class="col-md-8 order-md-1">
          <div class="panel panel-primary">
            <div class="panel-heading">Select Your Template</div>
            <div class="panel-body">
              <label class="radio-inline"
                ><input
                  type="radio"
                  name="template"
                  value="0"
                  checked
                />Template 1</label
              >
              <label class="radio-inline"
                ><input type="radio" name="template" value="1" />Template
                2</label
              >
              <label class="radio-inline"
                ><input type="radio" name="template" value="2" />Template
                3</label
              >
            </div>
          </div>
          <div class="panel panel-primary" id="section-paper-texture">
            <div class="panel-heading">Select Paper Texture</div>
            <div class="panel-body"></div>
          </div>
          <div class="panel panel-primary" id="section-pump-logo">
            <div class="panel-heading">Select Pump Logo</div>
            <div class="panel-body"></div>
          </div>
          <div class="panel panel-primary" id="section-optional-fields">
            <div class="panel-heading">Optinal Fields</div>
            <div class="panel-body"></div>
          </div>
          <div class="panel panel-primary" id="section-data">
            <div class="panel-heading">Enter Data</div>
            <div class="panel-body">
              <div class="row"></div>
            </div>
          </div>
          <button type="button" class="btn btn-default" disabled>
            Load Last Saved Data
          </button>
          <button type="button" class="btn btn-default" id="loadDefaultData">
            Reset
          </button>
          <button type="button" class="btn btn-default" id="generate">
            Preview
          </button>
          <button type="button" class="btn btn-default" id="download">
            Download
          </button>
        </div>
        <div class="col-md-4">
          <div class="panel panel-default" style="margin-bottom:10px;">
            <div class="panel-heading" style="padding:6px 10px;font-size:12px;">Surface</div>
            <div class="panel-body" style="padding:6px 10px;">
              <select id="surface-select" class="form-control input-sm">
                <option value="surface-wooden-desk" selected>Wooden Desk</option>
                <option value="surface-dark-wood">Dark Wood</option>
                <option value="surface-white-tiles">White Tiles</option>
                <option value="surface-beige-tiles">Beige Tiles</option>
                <option value="surface-grey-marble">Grey Marble</option>
                <option value="surface-black-granite">Black Granite</option>
              </select>
            </div>
          </div>
          <input
            type="range"
            class="slider"
            id="percentage-slider"
            min="0"
            max="100"
            value="100"
          />
          <div id="template-container" class="surface-wooden-desk"></div>
        </div>
      </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="templates/AbstractTemplate.js"></script>
    <script src="templates/template-1/Template1.js"></script>
    <script src="templates/template-2/Template2.js"></script>
    <script src="templates/template-3/Template3.js"></script>
    <script>
      const templates = [
        new Template1("template-container"),
        new Template2("template-container"),
        new Template3("template-container"),
      ];
      var templateIndex;
      var template;

      $(document).ready(async function () {
        await onInit();

        $("#loadDefaultData").on("click", async function () {
          await onTemplateSelected();
        });

        $("#generate").on("click", function () {
          generate(template);
        });

        $("#download").on("click", function () {
          downloadBill(template);
        });

        $("input[name=template]").change(async function () {
          await onTemplateSelected();
        });

        $(document).on("click", "input[name=texture]", async function () {
          generate(template);
        });

        $(document).on("click", "input[name=pumpLogo]", async function () {
          generate(template);
        });

        $(document).on("click", ".optional-fields", async function () {
          generate(template);
        });

        $(document).on("keyup", ".text-input", async function () {
          generate(template);
        });

        $("#surface-select").on("change", function () {
          var el = $("#template-container");
          el.removeClass("surface-wooden-desk surface-dark-wood surface-white-tiles surface-beige-tiles surface-grey-marble surface-black-granite");
          el.addClass($(this).val());
        });
      });

      async function onInit() {
        // Select template from URL param (1-based for user, converted to 0-based)
        const params = new URLSearchParams(window.location.search);
        const tplParam = params.get("template");
        if (tplParam !== null) {
          const idx = parseInt(tplParam, 10) - 1;
          if (idx >= 0 && idx < templates.length) {
            $(`input[name=template][value="${idx}"]`).prop("checked", true);
          }
        }

        await onTemplateSelected();
        initZoomSlider();

        // Apply remaining URL params after form is rendered
        if (params.size > 0) {
          applyUrlParams(template);
        }
      }
    </script>
  </body>
</html>
